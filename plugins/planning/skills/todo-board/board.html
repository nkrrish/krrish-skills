<title>{{TITLE}}</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap">
<style>
  :root {
    --ground: #F5F6F2;
    --surface: #FFFFFF;
    --surface-2: #ECEEE7;
    --surface-3: #E3E6DC;
    --line: #DDE0D6;
    --line-strong: #C4C8BB;
    --ink: #191B17;
    --ink-2: #4B4F46;
    --muted: #7A7E74;
    --lime: #C8F03A;
    --on-lime: #111;
    --iris: #5F55D9;
    --iris-soft: #ECEAFB;
    --done: #2E8B57;
    --done-soft: #E3F3E8;
    --danger: #B3261E;
    --shadow: 0 1px 2px rgba(20, 24, 12, 0.06), 0 8px 24px rgba(20, 24, 12, 0.08);
    --shadow-lift: 0 2px 4px rgba(20, 24, 12, 0.10), 0 16px 40px rgba(20, 24, 12, 0.18);
    --radius: 10px;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
    --serif: "Instrument Serif", "Iowan Old Style", Georgia, serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #151713;
      --surface: #1F221D;
      --surface-2: #272A24;
      --surface-3: #30342C;
      --line: #30342D;
      --line-strong: #444940;
      --ink: #ECEEE6;
      --ink-2: #C3C6BC;
      --muted: #8B8F85;
      --lime: #C8F03A;
      --on-lime: #111;
      --iris: #8C84EE;
      --iris-soft: #2A2842;
      --done: #6CC58F;
      --done-soft: #1F3328;
      --danger: #F08A82;
      --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 8px 24px rgba(0,0,0,0.35);
      --shadow-lift: 0 2px 4px rgba(0,0,0,0.5), 0 16px 40px rgba(0,0,0,0.55);
    }
  }
  :root[data-theme="dark"] {
    --ground: #151713;
    --surface: #1F221D;
    --surface-2: #272A24;
    --surface-3: #30342C;
    --line: #30342D;
    --line-strong: #444940;
    --ink: #ECEEE6;
    --ink-2: #C3C6BC;
    --muted: #8B8F85;
    --lime: #C8F03A;
    --on-lime: #111;
    --iris: #8C84EE;
    --iris-soft: #2A2842;
    --done: #6CC58F;
    --done-soft: #1F3328;
    --danger: #F08A82;
    --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 8px 24px rgba(0,0,0,0.35);
    --shadow-lift: 0 2px 4px rgba(0,0,0,0.5), 0 16px 40px rgba(0,0,0,0.55);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--iris); outline-offset: 2px; }
  svg { display: block; }

  .app { display: flex; flex-direction: column; height: 100%; }

  /* ---------- Header ---------- */
  .topbar {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 18px 28px 6px;
  }
  .brand { display: flex; align-items: baseline; gap: 12px; }
  .brand .mark { align-self: center; width: 26px; height: 26px; flex: none; }
  .brand h1 {
    margin: 0; font-family: var(--serif); font-weight: 400; font-size: 30px;
    line-height: 1; letter-spacing: -0.01em; text-wrap: balance;
  }
  .brand .sub { color: var(--muted); font-size: 13px; }
  .spacer { flex: 1; }
  .status { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
  .status .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--line-strong); }
  .status.live .dot { background: var(--done); }
  .status.local .dot { background: #D9A400; }

  /* Shared controls */
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    height: 32px; padding: 0 12px;
    border: 1px solid var(--line-strong); border-radius: 8px;
    background: var(--surface); color: var(--ink);
    font-size: 13px; font-weight: 500; line-height: 1;
    transition: border-color 120ms ease, background 120ms ease, opacity 120ms ease;
  }
  .btn:hover { border-color: var(--ink-2); }
  .btn.primary { background: var(--ink); color: var(--ground); border-color: var(--ink); }
  .btn.primary:hover { opacity: 0.88; }
  .btn.quiet { border-color: transparent; background: transparent; color: var(--ink-2); }
  .btn.quiet:hover { background: var(--surface-2); border-color: transparent; }
  .btn.icon { width: 32px; padding: 0; justify-content: center; }
  .btn.danger { color: var(--danger); }
  .btn.danger:hover { border-color: var(--danger); background: transparent; }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .btn svg { width: 15px; height: 15px; }
  .control {
    height: 32px; border: 1px solid var(--line-strong); border-radius: 8px;
    background: var(--surface); color: var(--ink); padding: 0 10px; font-size: 13px;
  }
  .control:focus { outline: none; border-color: var(--iris); box-shadow: 0 0 0 3px color-mix(in srgb, var(--iris) 22%, transparent); }
  select.control { padding-right: 8px; }

  /* ---------- Toolbar ---------- */
  .toolbar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 6px 28px 12px;
  }
  .search { display: inline-flex; align-items: center; gap: 4px; }
  .search .field { position: relative; display: none; }
  .search.open .field { display: inline-flex; }
  .search input { width: 240px; padding-right: 30px; }
  .search input::placeholder { color: var(--muted); }
  .search input::-webkit-search-cancel-button { display: none; }
  .search .clear {
    position: absolute; right: 4px; top: 4px; width: 24px; height: 24px; border: 0; border-radius: 6px;
    background: transparent; color: var(--muted); font-size: 13px; line-height: 1;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .search .clear:hover { background: var(--surface-2); color: var(--ink); }
  .search.open .glass-btn { color: var(--ink); background: var(--surface-2); }
  .filter {
    display: inline-flex; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden;
    background: var(--surface); height: 32px;
  }
  .filter button {
    border: 0; background: transparent; padding: 0 11px; font-size: 12.5px; color: var(--ink-2); line-height: 1;
    display: inline-flex; align-items: center; gap: 5px;
  }
  .filter button:hover { background: var(--surface-2); }
  .filter button.on { background: var(--ink); color: var(--ground); }
  .filter button + button { border-left: 1px solid var(--line); }
  .filter button.on + button, .filter button.on { border-left-color: transparent; }
  .filter .owner { width: 14px; height: 14px; color: currentColor; }
  .count-note { color: var(--muted); font-size: 12px; margin-left: auto; font-variant-numeric: tabular-nums; }
  .toolbar .search { margin-left: 2px; }

  /* ---------- Board ---------- */
  .board {
    flex: 1; display: grid; grid-template-columns: repeat(3, minmax(270px, 1fr));
    gap: 14px; padding: 0 28px 24px; overflow-x: auto; min-height: 0;
  }
  .column {
    display: flex; flex-direction: column; min-height: 0;
    background: var(--surface-2); border-radius: 14px;
    transition: box-shadow 120ms ease, background 120ms ease;
  }
  .column.over { box-shadow: inset 0 0 0 2px var(--iris); background: color-mix(in srgb, var(--iris) 6%, var(--surface-2)); }
  .col-head { display: flex; align-items: center; gap: 8px; padding: 14px 14px 8px; }
  .col-head h2 { margin: 0; font-size: 12.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; }
  .col-head .count {
    font-family: var(--mono); font-size: 11px; color: var(--ink-2);
    background: var(--surface-3); border-radius: 999px; padding: 1px 7px; font-variant-numeric: tabular-nums;
  }
  .col-head .rule { color: var(--muted); font-size: 12px; margin-left: auto; text-align: right; }
  .cards { flex: 1; display: flex; flex-direction: column; gap: 8px; padding: 4px 10px 12px; overflow-y: auto; min-height: 80px; }
  .empty {
    color: var(--muted); font-size: 13px; padding: 20px 8px; text-align: center;
    border: 1px dashed var(--line-strong); border-radius: var(--radius);
    display: flex; flex-direction: column; align-items: center; gap: 8px;
  }
  .empty .btn { height: 28px; font-size: 12.5px; }
  .drop-line { height: 3px; border-radius: 3px; background: var(--iris); margin: -4px 4px; }

  .card {
    background: var(--surface); border-radius: var(--radius); padding: 10px 12px 9px;
    box-shadow: 0 1px 1px rgba(20,24,12,0.05), 0 0 0 1px var(--line);
    cursor: grab; display: flex; flex-direction: column; gap: 5px; position: relative;
    transition: box-shadow 140ms ease, transform 140ms ease;
  }
  .card:hover { box-shadow: var(--shadow); transform: translateY(-1px); }
  .card:active { cursor: grabbing; }
  .card:focus-visible { outline: 2px solid var(--iris); outline-offset: 1px; }
  .card.dragging { opacity: 0.35; transform: none; }
  .card .meta { display: flex; align-items: center; justify-content: space-between; }
  .card .num { font-family: var(--mono); font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .card .title { font-weight: 600; font-size: 14px; line-height: 1.3; }
  .card .summary {
    color: var(--ink-2); font-size: 12.5px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .card .foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 2px; }
  .card .when { font-size: 11px; color: var(--muted); white-space: nowrap; margin-left: auto; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .chip { font-size: 11px; font-weight: 500; padding: 2px 7px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); }
  .chip.blocked { background: var(--iris-soft); color: var(--iris); }
  .chip.done { background: var(--done-soft); color: var(--done); }
  .chip.tag { background: transparent; box-shadow: inset 0 0 0 1px var(--line-strong); color: var(--ink-2); }
  select.control.tagsel { max-width: 180px; }
  select.control.tagsel.on { background: var(--ink); color: var(--ground); border-color: var(--ink); }
  .owner { width: 18px; height: 18px; flex: none; }
  .owner.user { color: var(--ink-2); }
  .owner.agent { color: var(--iris); }
  .card.is-done .title { color: var(--ink-2); }
  .card.is-done .num::after { content: " ✓"; color: var(--done); }

  /* ---------- Dialog ---------- */
  .backdrop {
    position: fixed; inset: 0; background: rgba(12, 14, 8, 0.45);
    display: flex; align-items: flex-start; justify-content: center;
    padding: 6vh 16px 16px; overflow-y: auto; z-index: 10;
    animation: fade 120ms ease;
  }
  .modal {
    width: min(760px, 100%); background: var(--surface); border-radius: 16px;
    box-shadow: var(--shadow-lift); display: flex; flex-direction: column; max-height: 88vh;
    animation: rise 160ms ease;
  }
  @keyframes fade { from { opacity: 0; } }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
  .modal-head { display: flex; align-items: flex-start; gap: 12px; padding: 18px 20px 0; }
  .modal-head .num { font-family: var(--mono); font-size: 12px; color: var(--muted); padding-top: 8px; }
  .modal-head .title-wrap { flex: 1; min-width: 0; }
  .modal-head input.title {
    width: 100%; border: 1px solid transparent; background: transparent;
    font-size: 20px; font-weight: 600; line-height: 1.25; padding: 4px 6px; margin-left: -6px; border-radius: 6px;
  }
  .modal-head input.title:hover { border-color: var(--line); }
  .modal-head input.title:focus { border-color: var(--iris); outline: none; background: var(--ground); }
  .props {
    display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center;
    margin: 10px 20px 0; padding: 10px 12px;
    background: var(--surface-2); border-radius: 10px;
  }
  .props label { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
  .props .control { height: 28px; font-size: 12.5px; }
  .props input.blocked { width: 96px; }
  .props input.tags { width: 200px; }
  .props .chips { margin-left: auto; }
  .modal-body { padding: 14px 20px 20px; overflow-y: auto; }
  .seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; margin-bottom: 12px; height: 28px; }
  .seg button { border: 0; background: transparent; padding: 0 12px; font-size: 12.5px; color: var(--ink-2); }
  .seg button.on { background: var(--ink); color: var(--ground); }
  textarea.details {
    width: 100%; min-height: 300px; resize: vertical;
    border: 1px solid var(--line-strong); border-radius: 8px; padding: 12px;
    font-family: var(--mono); font-size: 12.5px; line-height: 1.5; background: var(--ground);
  }
  textarea.details:focus { outline: none; border-color: var(--iris); }
  .rendered { max-width: 66ch; font-size: 14.5px; line-height: 1.55; }
  .rendered h3 { font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin: 18px 0 6px; }
  .rendered h3:first-child { margin-top: 0; }
  .rendered p { margin: 0 0 10px; }
  .rendered ul { margin: 0 0 10px; padding-left: 20px; }
  .rendered li { margin: 4px 0; }
  .rendered code { font-family: var(--mono); font-size: 12px; background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }
  .rendered strong { font-weight: 600; }
  .rendered .placeholder { color: var(--muted); font-style: italic; }
  .modal-foot {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 12px 20px 14px; border-top: 1px solid var(--line);
  }
  .modal-foot .right { margin-left: auto; display: inline-flex; align-items: center; gap: 10px; }
  .modal-foot .hint { color: var(--muted); font-size: 12px; }

  /* ---------- New card form ---------- */
  .newform { display: flex; flex-direction: column; gap: 14px; padding: 20px 20px 18px; }
  .newform h2 { margin: 0; font-size: 17px; font-weight: 600; line-height: 1.2; }
  .field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .field > span { font-size: 12px; color: var(--muted); line-height: 1; }
  .field input, .field textarea, .field .filter {
    width: 100%; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--ground);
    font-size: 13.5px; color: var(--ink);
  }
  .field input { height: 36px; padding: 0 10px; }
  .field input::placeholder, .field textarea::placeholder { color: var(--muted); }
  .field input:focus, .field textarea:focus { outline: none; border-color: var(--iris); box-shadow: 0 0 0 3px color-mix(in srgb, var(--iris) 22%, transparent); }
  .field textarea { min-height: 120px; padding: 10px; font-family: var(--mono); font-size: 12.5px; line-height: 1.5; resize: vertical; }
  .field .filter { height: 36px; display: flex; overflow: hidden; }
  .field .filter button { flex: 1; justify-content: center; font-size: 13px; padding: 0; }
  .field .filter .owner { width: 15px; height: 15px; }
  .newform .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .newform .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 2px; }
  @media (max-width: 560px) { .newform .row { grid-template-columns: 1fr; } }

  .toast {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
    background: var(--ink); color: var(--ground); padding: 8px 14px; border-radius: 8px; font-size: 13px;
    box-shadow: var(--shadow-lift); z-index: 20;
  }

  @media (max-width: 900px) {
    .board { grid-template-columns: repeat(3, 280px); padding: 0 16px 20px; }
    .topbar { padding: 16px 16px 6px; }
    .toolbar { padding: 6px 16px 10px; }
    .count-note { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
    .card:hover { transform: none; }
  }
</style>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <svg class="mark" viewBox="0 0 26 26" aria-hidden="true">
        <rect x="0.5" y="0.5" width="25" height="25" rx="6.5" fill="var(--lime)" stroke="rgba(0,0,0,0.18)"/>
        <rect x="5" y="6" width="4.5" height="14" rx="1.5" fill="#111"/>
        <rect x="10.75" y="6" width="4.5" height="9" rx="1.5" fill="#111"/>
        <rect x="16.5" y="6" width="4.5" height="5" rx="1.5" fill="#111"/>
      </svg>
      <h1>{{TITLE}}</h1>
      <span class="sub">{{SUBTITLE}}</span>
    </div>
    <div class="spacer"></div>
    <span class="status" id="status"><span class="dot"></span><span id="status-text">Connecting</span></span>
    <button class="btn primary" id="add-btn">+ New card</button>
  </header>

  <div class="toolbar">
    <div class="filter" id="filter" role="group" aria-label="Show cards for">
      <button data-owner="all" class="on">All</button>
      <button data-owner="user"><svg class="owner user" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="6.5" r="3.4"/><path d="M3.6 17.2c.7-3.5 3.3-5.4 6.4-5.4s5.7 1.9 6.4 5.4"/></svg>User</button>
      <button data-owner="agent"><svg class="owner agent" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M9 2.4c.2-.6 1-.6 1.2 0l1.4 4.1c.1.3.3.5.6.6l4.1 1.4c.6.2.6 1 0 1.2l-4.1 1.4c-.3.1-.5.3-.6.6l-1.4 4.1c-.2.6-1 .6-1.2 0l-1.4-4.1c-.1-.3-.3-.5-.6-.6L2.9 9.7c-.6-.2-.6-1 0-1.2L7 7.1c.3-.1.5-.3.6-.6z"/><circle cx="15.8" cy="15.6" r="1.7"/></svg>Agent</button>
    </div>
    <select class="control tagsel" id="tag-filter" aria-label="Filter by tag"><option value="">All tags</option></select>
    <datalist id="tag-list"></datalist>
    <span class="count-note" id="count-note"></span>
    <div class="search" id="search">
      <span class="field">
        <input class="control" id="search-input" type="search" placeholder="Search cards" autocomplete="off" spellcheck="false" aria-label="Search cards">
        <button class="clear" id="search-clear" type="button" aria-label="Clear search">✕</button>
      </span>
      <button class="btn quiet icon glass-btn" id="search-open" type="button" aria-label="Search cards" title="Search cards (/)">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="M13 13l4.5 4.5"/></svg>
      </button>
    </div>
  </div>

  <main class="board" id="board"></main>
</div>

<script>
(() => {
  const COLUMNS = [
    { id: 'todo',   name: 'Todo',   rule: 'Agreed, not finished' },
    { id: 'review', name: 'Review', rule: 'Built, waiting for you to try it' },
    { id: 'done',   name: 'Done',   rule: 'Tested, pushed, deployed' },
  ];
  const LS_KEY = 'todo-board-{{SLUG}}';
  const ICONS = {
    user: '<svg class="owner user" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="User task"><title>User task</title><circle cx="10" cy="6.5" r="3.4"/><path d="M3.6 17.2c.7-3.5 3.3-5.4 6.4-5.4s5.7 1.9 6.4 5.4"/></svg>',
    agent: '<svg class="owner agent" viewBox="0 0 20 20" fill="currentColor" role="img" aria-label="Agent task"><title>Agent task</title><path d="M9 2.4c.2-.6 1-.6 1.2 0l1.4 4.1c.1.3.3.5.6.6l4.1 1.4c.6.2.6 1 0 1.2l-4.1 1.4c-.3.1-.5.3-.6.6l-1.4 4.1c-.2.6-1 .6-1.2 0l-1.4-4.1c-.1-.3-.3-.5-.6-.6L2.9 9.7c-.6-.2-.6-1 0-1.2L7 7.1c.3-.1.5-.3.6-.6z"/><circle cx="15.8" cy="15.6" r="1.7"/></svg>'
  };

  let db = null;
  let cards = {};
  let openId = null;
  let detailMode = 'read';
  let drag = null;
  let saveTimer = null;
  let ownerFilter = 'all';
  let tagFilter = '';
  let query = '';
  let lastFocus = null;
  try { ownerFilter = localStorage.getItem(LS_KEY + '-filter') || 'all'; } catch (e) {}
  try { tagFilter = localStorage.getItem(LS_KEY + '-tag') || ''; } catch (e) {}

  const $ = (s, r = document) => r.querySelector(s);
  const boardEl = $('#board');

  /* ---------- Storage ---------- */
  function setStatus(kind, text) { $('#status').className = 'status ' + kind; $('#status-text').textContent = text; }
  function loadLocal() { try { const raw = localStorage.getItem(LS_KEY); if (raw) cards = JSON.parse(raw) || {}; } catch (e) {} }
  function persistLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(cards)); } catch (e) {} }
  async function writeCard(card) {
    cards[card.id] = card;
    render();
    if (db) {
      try { await db.doc('cards/' + card.id).set(card); }
      catch (e) { toast('Could not save. ' + (e && e.message ? e.message : '')); }
    } else persistLocal();
  }
  async function removeCard(id) {
    delete cards[id];
    render();
    if (db) {
      try { await db.doc('cards/' + id).delete(); }
      catch (e) { toast('Could not delete. ' + (e && e.message ? e.message : '')); }
    } else persistLocal();
  }
  async function connect() {
    loadLocal();
    render();
    let ns = null;
    try { ns = await window.claude?.use?.('db'); } catch (e) { ns = null; }
    if (!ns) { setStatus('local', 'Saved in this browser only'); return; }
    db = ns;
    db.collection('cards').onSnapshot(snap => {
      const next = {};
      snap.docs.forEach(d => { if (d.exists) next[d.id] = Object.assign({ id: d.id }, d.data()); });
      cards = next;
      setStatus('live', snap.metadata.fromCache ? 'Syncing' : 'Synced');
      render();
      if (openId && !cards[openId]) closeModal();
      else if (openId && detailMode === 'read' && cardKey(cards[openId]) !== renderedKey) renderModal();
    }, err => {
      setStatus('local', 'Live sync stopped');
      toast('Sync stopped. ' + (err && err.message ? err.message : ''));
    });
  }

  /* ---------- Helpers ---------- */
  function nextNumber() { const n = Object.values(cards).map(c => Number(c.number) || 0); return (n.length ? Math.max(...n) : 0) + 1; }
  function ownerOf(c) { return c.owner === 'user' ? 'user' : 'agent'; }
  function ownerIcon(c) { return ICONS[ownerOf(c)]; }
  function tagsOf(c) { return Array.isArray(c.tags) ? c.tags.map(t => String(t).trim()).filter(Boolean) : []; }
  function parseTags(s) {
    const known = allTags().map(t => t.name);
    const out = [];
    for (const raw of String(s || '').split(',')) {
      const t = raw.trim(); if (!t) continue;
      const canon = known.find(k => k.toLowerCase() === t.toLowerCase()) || t;
      if (!out.some(x => x.toLowerCase() === canon.toLowerCase())) out.push(canon);
    }
    return out;
  }
  function allTags() {
    const counts = {};
    for (const c of Object.values(cards)) for (const t of tagsOf(c)) counts[t] = (counts[t] || 0) + 1;
    return Object.keys(counts).sort((a, b) => a.localeCompare(b)).map(name => ({ name, count: counts[name] }));
  }
  function hasTag(c, tag) { return tagsOf(c).some(t => t.toLowerCase() === tag.toLowerCase()); }
  function tagChips(card) {
    return tagsOf(card).map(t => '<span class="chip tag">' + esc(t) + '</span>').join('');
  }
  function matches(c) {
    if (!query) return true;
    const hay = ('#' + (c.number ?? '') + ' ' + (c.title || '') + ' ' + (c.summary || '') + ' ' + (c.details || '') + ' ' + tagsOf(c).join(' ')).toLowerCase();
    return query.split(/\s+/).filter(Boolean).every(w => hay.includes(w));
  }
  function filtering() { return Boolean(query) || ownerFilter !== 'all' || Boolean(tagFilter); }
  function inColumn(col, visibleOnly) {
    return Object.values(cards)
      .filter(c => c.column === col)
      .filter(c => !visibleOnly || ownerFilter === 'all' || ownerOf(c) === ownerFilter)
      .filter(c => !visibleOnly || !tagFilter || hasTag(c, tagFilter))
      .filter(c => !visibleOnly || matches(c))
      .sort((a, b) => (a.order ?? 0) - (b.order ?? 0) || (a.number ?? 0) - (b.number ?? 0));
  }
  function esc(s) { return String(s ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch])); }
  function inline(s) { return esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>'); }
  function md(text) {
    if (!text || !text.trim()) return '<p class="placeholder">No details yet. Switch to Edit to add some.</p>';
    const lines = text.replace(/\r/g, '').split('\n');
    let out = '', para = [], list = [];
    const flushP = () => { if (para.length) { out += '<p>' + inline(para.join(' ')) + '</p>'; para = []; } };
    const flushL = () => { if (list.length) { out += '<ul>' + list.map(l => '<li>' + inline(l) + '</li>').join('') + '</ul>'; list = []; } };
    for (const raw of lines) {
      const line = raw.trimEnd();
      if (/^#{1,3}\s+/.test(line)) { flushP(); flushL(); out += '<h3>' + inline(line.replace(/^#{1,3}\s+/, '')) + '</h3>'; }
      else if (/^[-*]\s+/.test(line)) { flushP(); list.push(line.replace(/^[-*]\s+/, '')); }
      else if (line.trim() === '') { flushP(); flushL(); }
      else { flushL(); para.push(line.trim()); }
    }
    flushP(); flushL();
    return out;
  }
  function blockedChips(card) {
    return (card.blockedBy || '').split(',').map(s => s.trim()).filter(Boolean).map(n => {
      const dep = Object.values(cards).find(c => String(c.number) === n);
      const resolved = dep && dep.column === 'done';
      return '<span class="chip ' + (resolved ? 'done' : 'blocked') + '" title="' + esc(dep ? dep.title : 'Card #' + n) + '">' + (resolved ? 'Unblocked by' : 'Blocked by') + ' #' + esc(n) + '</span>';
    }).join('');
  }
  function timeAgo(iso) {
    if (!iso) return '';
    const s = (Date.now() - new Date(iso).getTime()) / 1000;
    if (isNaN(s)) return '';
    if (s < 60) return 'just now';
    if (s < 3600) return Math.floor(s / 60) + 'm ago';
    if (s < 86400) return Math.floor(s / 3600) + 'h ago';
    if (s < 86400 * 14) return Math.floor(s / 86400) + 'd ago';
    return new Date(iso).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  }
  function now() { return new Date().toISOString(); }
  function cardKey(card) { return card ? JSON.stringify(card) + '|' + detailMode : ''; }
  function toast(msg) {
    const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
    document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
  }

  /* ---------- Board ---------- */
  function render() {
    boardEl.innerHTML = '';
    for (const col of COLUMNS) {
      const list = inColumn(col.id, true);
      const colEl = document.createElement('section');
      colEl.className = 'column'; colEl.dataset.col = col.id;
      colEl.innerHTML =
        '<div class="col-head"><h2>' + col.name + '</h2><span class="count">' + list.length + '</span><span class="rule">' + col.rule + '</span></div>' +
        '<div class="cards" data-col="' + col.id + '"></div>';
      const cardsEl = colEl.querySelector('.cards');
      if (!list.length) {
        const e = document.createElement('div'); e.className = 'empty';
        if (query) e.textContent = 'No matches';
        else if (tagFilter) e.textContent = 'No ' + tagFilter + ' cards here';
        else if (ownerFilter !== 'all') e.textContent = 'No ' + ownerFilter + ' cards here';
        else if (col.id === 'todo') { e.innerHTML = '<span>Nothing to do yet</span><button class="btn" type="button">+ Add a card</button>'; e.querySelector('button').addEventListener('click', openNewForm); }
        else e.textContent = col.id === 'review' ? 'Nothing waiting for review' : 'Nothing finished yet';
        cardsEl.appendChild(e);
      }
      for (const card of list) cardsEl.appendChild(cardEl(card));
      wireDrop(colEl, cardsEl);
      boardEl.appendChild(colEl);
    }
    const total = Object.keys(cards).length;
    const shown = COLUMNS.reduce((n, c) => n + inColumn(c.id, true).length, 0);
    $('#count-note').textContent = filtering() ? shown + ' of ' + total + ' cards' : total + ' card' + (total === 1 ? '' : 's');
    syncTags();
  }
  function syncTags() {
    const tags = allTags();
    if (tagFilter && !tags.some(t => t.name.toLowerCase() === tagFilter.toLowerCase())) tags.push({ name: tagFilter, count: 0 });
    const sel = $('#tag-filter');
    sel.innerHTML = '<option value="">All tags</option>' + tags.map(t => '<option value="' + esc(t.name) + '">' + esc(t.name) + ' (' + t.count + ')</option>').join('');
    sel.value = tagFilter;
    sel.classList.toggle('on', Boolean(tagFilter));
    $('#tag-list').innerHTML = tags.filter(t => t.count).map(t => '<option value="' + esc(t.name) + '">').join('');
  }
  function cardEl(card) {
    const el = document.createElement('article');
    el.className = 'card' + (card.column === 'done' ? ' is-done' : '');
    el.draggable = true; el.tabIndex = 0; el.dataset.id = card.id;
    el.setAttribute('aria-label', 'Card ' + card.number + ', ' + card.title);
    const chips = tagChips(card) + blockedChips(card);
    el.innerHTML =
      '<div class="meta"><span class="num">#' + esc(card.number) + '</span>' + ownerIcon(card) + '</div>' +
      '<div class="title">' + esc(card.title) + '</div>' +
      (card.summary ? '<div class="summary">' + esc(card.summary) + '</div>' : '') +
      '<div class="foot">' + (chips ? '<div class="chips">' + chips + '</div>' : '') + '<span class="when">' + esc(timeAgo(card.updatedAt)) + '</span></div>';
    el.addEventListener('click', () => openModal(card.id, el));
    el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openModal(card.id, el); } });
    el.addEventListener('dragstart', e => {
      drag = { id: card.id }; el.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      try { e.dataTransfer.setData('text/plain', card.id); } catch (_) {}
    });
    el.addEventListener('dragend', () => { drag = null; el.classList.remove('dragging'); clearDropMarks(); });
    return el;
  }
  function clearDropMarks() {
    document.querySelectorAll('.column.over').forEach(c => c.classList.remove('over'));
    document.querySelectorAll('.drop-line').forEach(l => l.remove());
  }
  function dropIndex(cardsEl, y) {
    const siblings = Array.from(cardsEl.querySelectorAll('.card')).filter(c => c.dataset.id !== drag.id);
    for (let i = 0; i < siblings.length; i++) {
      const r = siblings[i].getBoundingClientRect();
      if (y < r.top + r.height / 2) return { index: i, before: siblings[i] };
    }
    return { index: siblings.length, before: null };
  }
  function wireDrop(colEl, cardsEl) {
    colEl.addEventListener('dragover', e => {
      if (!drag) return;
      e.preventDefault(); e.dataTransfer.dropEffect = 'move';
      if (!colEl.classList.contains('over')) { clearDropMarks(); colEl.classList.add('over'); }
      const { before } = dropIndex(cardsEl, e.clientY);
      let line = cardsEl.querySelector('.drop-line');
      if (!line) { line = document.createElement('div'); line.className = 'drop-line'; }
      if (before) cardsEl.insertBefore(line, before); else cardsEl.appendChild(line);
    });
    colEl.addEventListener('dragleave', e => { if (!colEl.contains(e.relatedTarget)) { colEl.classList.remove('over'); cardsEl.querySelectorAll('.drop-line').forEach(l => l.remove()); } });
    colEl.addEventListener('drop', e => {
      if (!drag) return;
      e.preventDefault();
      const { index } = dropIndex(cardsEl, e.clientY);
      clearDropMarks();
      moveCard(drag.id, colEl.dataset.col, index);
    });
  }
  function moveCard(id, col, index) {
    const card = cards[id]; if (!card) return;
    const list = inColumn(col).filter(c => c.id !== id);
    if (index == null) index = list.length;
    list.splice(index, 0, card);
    list.forEach((c, i) => {
      const order = (i + 1) * 10;
      if (c.id === id) writeCard(Object.assign({}, c, { column: col, order, updatedAt: now() }));
      else if (c.order !== order) writeCard(Object.assign({}, c, { order }));
    });
  }

  /* ---------- Dialog plumbing ---------- */
  let modalRoot = null;
  let renderedKey = '';
  function mountModal(html, label) {
    if (modalRoot) {
      // Already open: swap the contents so the backdrop and dialog keep their place and no entrance animation replays.
      const modal = modalRoot.firstElementChild;
      const scrollTop = modal.querySelector('.modal-body')?.scrollTop || 0;
      modal.setAttribute('aria-label', label);
      modal.innerHTML = html;
      const body = modal.querySelector('.modal-body'); if (body) body.scrollTop = scrollTop;
      return modal;
    }
    modalRoot = document.createElement('div');
    modalRoot.className = 'backdrop';
    modalRoot.innerHTML = '<div class="modal" role="dialog" aria-modal="true" aria-label="' + esc(label) + '">' + html + '</div>';
    modalRoot.addEventListener('mousedown', e => { if (e.target === modalRoot) closeModal(); });
    document.body.appendChild(modalRoot);
    document.addEventListener('keydown', onModalKey);
    return modalRoot.firstElementChild;
  }
  function closeModal() {
    commitDetails();
    openId = null; renderedKey = '';
    if (modalRoot) { modalRoot.remove(); modalRoot = null; }
    document.removeEventListener('keydown', onModalKey);
    if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
    lastFocus = null;
  }
  function onModalKey(e) {
    if (e.key === 'Escape') { e.preventDefault(); closeModal(); return; }
    if (e.key === 'Tab' && modalRoot) {
      const f = Array.from(modalRoot.querySelectorAll('button, input, select, textarea, [tabindex]:not([tabindex="-1"])')).filter(x => !x.disabled);
      if (!f.length) return;
      const first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  }

  /* ---------- Card view ---------- */
  function openModal(id, fromEl) {
    lastFocus = fromEl || document.activeElement;
    openId = id; detailMode = 'read';
    renderModal(true);
  }
  function renderModal(initial) {
    const card = cards[openId]; if (!card) return closeModal();
    const colIdx = COLUMNS.findIndex(c => c.id === card.column);
    const colOptions = COLUMNS.map(c => '<option value="' + c.id + '"' + (c.id === card.column ? ' selected' : '') + '>' + c.name + '</option>').join('');
    const prev = COLUMNS[colIdx - 1], next = COLUMNS[colIdx + 1];
    const chips = blockedChips(card);
    const html =
      '<div class="modal-head">' +
        '<span class="num">#' + esc(card.number) + '</span>' +
        '<div class="title-wrap"><input class="title" id="m-title" value="' + esc(card.title) + '" aria-label="Title"></div>' +
        '<button class="btn quiet icon" id="m-close" aria-label="Close" title="Close (Esc)"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 5l10 10M15 5L5 15"/></svg></button>' +
      '</div>' +
      '<div class="props">' +
        '<label>Column <select class="control" id="m-col">' + colOptions + '</select></label>' +
        '<label>' + ownerIcon(card) + 'Owner <select class="control" id="m-owner"><option value="agent"' + (ownerOf(card) === 'agent' ? ' selected' : '') + '>Agent</option><option value="user"' + (ownerOf(card) === 'user' ? ' selected' : '') + '>User</option></select></label>' +
        '<label>Blocked by <input class="control blocked" id="m-blocked" placeholder="e.g. 1, 4" value="' + esc(card.blockedBy || '') + '"></label>' +
        '<label>Tags <input class="control tags" id="m-tags" list="tag-list" autocomplete="off" placeholder="e.g. Infra, Product" value="' + esc(tagsOf(card).join(', ')) + '"></label>' +
        (chips ? '<span class="chips">' + chips + '</span>' : '') +
      '</div>' +
      '<div class="modal-body">' +
        '<div class="seg" role="group" aria-label="Details mode"><button id="m-read" class="' + (detailMode === 'read' ? 'on' : '') + '">Read</button><button id="m-edit" class="' + (detailMode === 'edit' ? 'on' : '') + '">Edit</button></div>' +
        (detailMode === 'read'
          ? '<div class="rendered">' + md(card.details) + '</div>'
          : '<textarea class="details" id="m-details" spellcheck="false" aria-label="Details">' + esc(card.details || '') + '</textarea>') +
      '</div>' +
      '<div class="modal-foot">' +
        '<button class="btn" id="m-back"' + (prev ? '' : ' disabled') + '>← ' + (prev ? 'Back to ' + prev.name : 'Back') + '</button>' +
        '<button class="btn" id="m-forward"' + (next ? '' : ' disabled') + '>' + (next ? 'Move to ' + next.name : 'Done') + ' →</button>' +
        '<span class="right"><span class="hint" id="m-hint">' + (card.updatedAt ? 'Updated ' + esc(timeAgo(card.updatedAt)) : '') + '</span>' +
        '<button class="btn quiet danger" id="m-delete">Delete</button></span>' +
      '</div>';
    const modal = mountModal(html, 'Card #' + card.number);
    renderedKey = cardKey(card);

    $('#m-close', modal).addEventListener('click', closeModal);
    $('#m-read', modal).addEventListener('click', () => { commitDetails(); detailMode = 'read'; renderModal(); $('#m-read', modalRoot).focus(); });
    $('#m-edit', modal).addEventListener('click', () => { detailMode = 'edit'; renderModal(); $('#m-details', modalRoot).focus(); });
    if (prev) $('#m-back', modal).addEventListener('click', () => { moveCard(card.id, prev.id); renderModal(); $('#m-back', modalRoot).focus(); });
    if (next) $('#m-forward', modal).addEventListener('click', () => { moveCard(card.id, next.id); renderModal(); $('#m-forward', modalRoot).focus(); });
    $('#m-delete', modal).addEventListener('click', () => {
      if (confirm('Delete card #' + card.number + ' "' + card.title + '"? This cannot be undone.')) { removeCard(card.id); closeModal(); }
    });
    $('#m-col', modal).addEventListener('change', e => { moveCard(card.id, e.target.value); renderModal(); $('#m-col', modalRoot).focus(); });
    $('#m-owner', modal).addEventListener('change', e => { writeCard(Object.assign({}, cards[card.id], { owner: e.target.value, updatedAt: now() })); renderModal(); $('#m-owner', modalRoot).focus(); });
    $('#m-title', modal).addEventListener('change', e => {
      const v = e.target.value.trim(); if (!v) { e.target.value = card.title; return; }
      writeCard(Object.assign({}, cards[card.id], { title: v, updatedAt: now() }));
    });
    $('#m-blocked', modal).addEventListener('change', e => { writeCard(Object.assign({}, cards[card.id], { blockedBy: e.target.value.trim(), updatedAt: now() })); renderModal(); $('#m-blocked', modalRoot).focus(); });
    $('#m-tags', modal).addEventListener('change', e => { writeCard(Object.assign({}, cards[card.id], { tags: parseTags(e.target.value), updatedAt: now() })); renderModal(); $('#m-tags', modalRoot).focus(); });
    const ta = $('#m-details', modal);
    if (ta) ta.addEventListener('input', () => { $('#m-hint', modalRoot).textContent = 'Editing'; clearTimeout(saveTimer); saveTimer = setTimeout(commitDetails, 700); });
    if (initial) $('#m-close', modal).focus();
  }
  function commitDetails() {
    clearTimeout(saveTimer);
    const ta = modalRoot && $('#m-details', modalRoot);
    if (!ta || !openId || !cards[openId]) return;
    const v = ta.value;
    const h = $('#m-hint', modalRoot);
    if (v === (cards[openId].details || '')) { if (h) h.textContent = 'Saved'; return; }
    writeCard(Object.assign({}, cards[openId], { details: v, updatedAt: now() }));
    if (h) h.textContent = 'Saved';
  }

  /* ---------- New card ---------- */
  function openNewForm() {
    lastFocus = document.activeElement;
    openId = null;
    const modal = mountModal(
      '<form class="newform" id="newform">' +
        '<h2>New card</h2>' +
        '<label class="field"><span>Title</span><input id="n-title" required autocomplete="off" placeholder="Short and imperative. Export a note as PDF"></label>' +
        '<label class="field"><span>Summary</span><input id="n-summary" autocomplete="off" placeholder="One line shown on the card"></label>' +
        '<div class="row">' +
          '<div class="field"><span>Owner</span><div class="filter" id="n-owner" role="group" aria-label="Owner"><button type="button" data-owner="agent" class="on">' + ICONS.agent + 'Agent</button><button type="button" data-owner="user">' + ICONS.user + 'User</button></div></div>' +
          '<label class="field"><span>Blocked by</span><input id="n-blocked" autocomplete="off" placeholder="Card numbers, e.g. 1, 4"></label>' +
        '</div>' +
        '<label class="field"><span>Tags</span><input id="n-tags" list="tag-list" autocomplete="off" placeholder="Comma separated, e.g. Infra, Product"></label>' +
        '<label class="field"><span>Details</span><textarea id="n-details" placeholder="## Heading, - bullets, **bold**, `code`"></textarea></label>' +
        '<div class="actions"><button type="button" class="btn quiet" id="n-cancel">Cancel</button><button type="submit" class="btn primary">Add to Todo</button></div>' +
      '</form>', 'New card');
    let owner = 'agent';
    $('#n-owner', modal).addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      owner = b.dataset.owner;
      modal.querySelectorAll('#n-owner button').forEach(x => x.classList.toggle('on', x === b));
    });
    $('#n-cancel', modal).addEventListener('click', closeModal);
    $('#newform', modal).addEventListener('submit', e => {
      e.preventDefault();
      const title = $('#n-title', modal).value.trim(); if (!title) return;
      const number = nextNumber();
      const todo = inColumn('todo');
      const card = {
        id: String(number), number, title,
        summary: $('#n-summary', modal).value.trim(),
        blockedBy: $('#n-blocked', modal).value.trim(),
        tags: parseTags($('#n-tags', modal).value),
        owner,
        details: $('#n-details', modal).value,
        column: 'todo',
        order: (todo.length ? Math.max(...todo.map(c => c.order || 0)) : 0) + 10,
        createdAt: now(), updatedAt: now(),
      };
      writeCard(card); closeModal(); toast('Added #' + number);
    });
    setTimeout(() => $('#n-title', modal).focus(), 0);
  }
  $('#add-btn').addEventListener('click', openNewForm);

  /* ---------- Owner filter ---------- */
  function syncFilter() { document.querySelectorAll('#filter button').forEach(b => b.classList.toggle('on', b.dataset.owner === ownerFilter)); }
  $('#filter').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    ownerFilter = b.dataset.owner;
    try { localStorage.setItem(LS_KEY + '-filter', ownerFilter); } catch (err) {}
    syncFilter(); render();
  });
  syncFilter();

  /* ---------- Tag filter ---------- */
  $('#tag-filter').addEventListener('change', e => {
    tagFilter = e.target.value;
    try { localStorage.setItem(LS_KEY + '-tag', tagFilter); } catch (err) {}
    render();
  });

  /* ---------- Search ---------- */
  const searchWrap = $('#search'), searchInput = $('#search-input');
  function setQuery(v) { query = (v || '').trim().toLowerCase(); render(); }
  function openSearch() { searchWrap.classList.add('open'); searchInput.focus(); searchInput.select(); }
  function closeSearch() { searchWrap.classList.remove('open'); }
  $('#search-open').addEventListener('click', () => {
    if (searchWrap.classList.contains('open')) { searchInput.value = ''; setQuery(''); closeSearch(); }
    else openSearch();
  });
  searchInput.addEventListener('input', () => setQuery(searchInput.value));
  searchInput.addEventListener('keydown', e => { if (e.key === 'Escape') { searchInput.value = ''; setQuery(''); closeSearch(); $('#search-open').focus(); } });
  searchInput.addEventListener('blur', () => { if (!searchInput.value.trim()) closeSearch(); });
  $('#search-clear').addEventListener('click', () => { searchInput.value = ''; setQuery(''); searchInput.focus(); });
  document.addEventListener('keydown', e => {
    if (e.key !== '/' || modalRoot) return;
    const t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable)) return;
    e.preventDefault(); openSearch();
  });

  connect();
})();
</script>
